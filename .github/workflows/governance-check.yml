name: dbt governance check

# Reusable workflow. Callers pin a tag so fixes arrive by bumping a version
# rather than re-copying vendored code.
#
# Column completeness is verified against catalog.json, which requires the
# changed models to be BUILT before `dbt docs generate` runs. If your repo
# already has a slim CI job that builds changed models, prefer calling the
# checker as a step there instead of running this workflow: a second build
# doubles CI cost and creates a second Snowflake credential path to review.
# See SETUP.md for that integration.

on:
  workflow_call:
    inputs:
      project-dir:
        description: "dbt project directory, relative to the repo root"
        type: string
        default: "."
      rules-file:
        description: "Path to governance_rules.yml, relative to project-dir"
        type: string
        default: "governance_rules.yml"
      requirements-file:
        description: >-
          Path to the Python requirements file that installs dbt, relative to
          project-dir. Set this when your requirements live at the repo root but
          the dbt project is in a subdirectory.
        type: string
        default: "requirements.txt"
      profiles-dir:
        description: >-
          Directory containing profiles.yml, relative to project-dir. Leave
          empty to use dbt's own resolution, which checks the project directory
          and then ~/.dbt.
        type: string
        default: ""
      python-version:
        type: string
        default: "3.11"
      dbt-target:
        description: "Target in profiles.yml to build against"
        type: string
        default: "ci"
      target-branch:
        description: >-
          Git branch used as the state and governance comparison baseline. Set
          this to an empty string to use the pull request base branch.
        type: string
        default: "dev"
      target-manifest-dbt-target:
        description: >-
          Target in profiles.yml used to parse the comparison branch. Its
          relation metadata is used by dbt deferral.
        type: string
        default: "dev"
      changed-only:
        description: "Only check models changed relative to the PR base"
        type: boolean
        default: true
      skip-catalog:
        description: >-
          Skip the build and `dbt docs generate`, running only the checks that
          need no warehouse. Column completeness cannot be verified this way.
        type: boolean
        default: false
      warnings-as-errors:
        type: boolean
        default: false
      governance-ref:
        description: "Ref of the dbt-governance-checks repo to install"
        type: string
        default: "v1.0.0"
      governance-repo:
        type: string
        default: "sfc-gh-mwinkel/dbt-governance-checks"
    secrets:
      DBT_ENV_SECRET_PRIVATE_KEY:
        required: false
      SNOWFLAKE_ACCOUNT:
        required: false
      SNOWFLAKE_USER:
        required: false
      SNOWFLAKE_ROLE:
        required: false
      SNOWFLAKE_WAREHOUSE:
        required: false
      SNOWFLAKE_DATABASE:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required: the base ref must be present locally for
      # changed-model scoping to work.
      - name: Check out the dbt project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the governance checker
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.governance-repo }}
          ref: ${{ inputs.governance-ref }}
          path: .governance-tool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Resolve target branch
        id: target-branch
        env:
          CONFIGURED_TARGET_BRANCH: ${{ inputs.target-branch }}
          PULL_REQUEST_BASE_BRANCH: ${{ github.base_ref }}
        run: |
          target_branch="${CONFIGURED_TARGET_BRANCH:-${PULL_REQUEST_BASE_BRANCH}}"
          if [ -z "${target_branch}" ]; then
            echo "::error::No target branch is available. Set the target-branch input or call this workflow from a pull request."
            exit 1
          fi
          if ! git check-ref-format --branch "${target_branch}" >/dev/null 2>&1; then
            echo "::error::Invalid target branch name: ${target_branch}"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${target_branch}^{commit}" >/dev/null; then
            echo "::error::Target branch 'origin/${target_branch}' is not available in this checkout."
            exit 1
          fi
          echo "branch=${target_branch}" >> "$GITHUB_OUTPUT"

      # Only exported when supplied: an empty DBT_PROFILES_DIR would be read as
      # a path rather than ignored, so leaving it unset lets dbt resolve
      # profiles itself (project directory, then ~/.dbt).
      - name: Resolve profiles directory
        if: inputs.profiles-dir != ''
        run: echo "DBT_PROFILES_DIR=${{ inputs.profiles-dir }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ inputs.project-dir }}
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ inputs.requirements-file }}" ]; then
            pip install -r "${{ inputs.requirements-file }}"
          else
            echo "::warning::${{ inputs.requirements-file }} not found under '${{ inputs.project-dir }}'."
            echo "::warning::If your requirements file is elsewhere, set the requirements-file input (resolved relative to project-dir)."
          fi
          pip install "${GITHUB_WORKSPACE}/.governance-tool"

      # dbt has to come from the project's own requirements. Failing here with a
      # precise message beats a bare "dbt: command not found" three steps later.
      - name: Verify dbt is available
        working-directory: ${{ inputs.project-dir }}
        run: |
          if ! command -v dbt >/dev/null 2>&1; then
            echo "::error::dbt is not installed. It should be pinned in your project's requirements file."
            echo "::error::Checked '${{ inputs.requirements-file }}' relative to project-dir '${{ inputs.project-dir }}'."
            exit 1
          fi
          dbt --version

      - name: dbt deps
        working-directory: ${{ inputs.project-dir }}
        run: dbt deps

      # Parse alone builds the manifest and needs no warehouse connection, so
      # the tag and description rules can run even if the build below fails.
      - name: dbt parse
        working-directory: ${{ inputs.project-dir }}
        run: dbt parse --target ${{ inputs.dbt-target }}
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          DBT_ENV_SECRET_PRIVATE_KEY: ${{ secrets.DBT_ENV_SECRET_PRIVATE_KEY }}

      - name: Generate target manifest
        if: ${{ !inputs.skip-catalog }}
        env:
          PROJECT_DIR: ${{ inputs.project-dir }}
          PROFILES_DIR: ${{ inputs.profiles-dir }}
          TARGET_BRANCH: ${{ steps.target-branch.outputs.branch }}
          TARGET_MANIFEST_DBT_TARGET: ${{ inputs.target-manifest-dbt-target }}
          TARGET_MANIFEST_DIR: ${{ runner.temp }}/target-manifest
          TARGET_WORKTREE: ${{ runner.temp }}/dbt-target-branch
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          DBT_ENV_SECRET_PRIVATE_KEY: ${{ secrets.DBT_ENV_SECRET_PRIVATE_KEY }}
        run: |
          cleanup() {
            git worktree remove --force "${TARGET_WORKTREE}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          rm -rf "${TARGET_MANIFEST_DIR}"
          git worktree add --detach "${TARGET_WORKTREE}" "origin/${TARGET_BRANCH}"

          target_project_dir="${TARGET_WORKTREE}/${PROJECT_DIR}"
          if [ ! -f "${target_project_dir}/dbt_project.yml" ]; then
            echo "::error::dbt_project.yml not found on target branch under '${PROJECT_DIR}'."
            exit 1
          fi

          if [ -n "${PROFILES_DIR}" ]; then
            export DBT_PROFILES_DIR="${target_project_dir}/${PROFILES_DIR}"
          elif [ -f "${target_project_dir}/profiles.yml" ]; then
            export DBT_PROFILES_DIR="${target_project_dir}"
          else
            unset DBT_PROFILES_DIR
          fi

          dbt deps --project-dir "${target_project_dir}"
          dbt parse \
            --project-dir "${target_project_dir}" \
            --target "${TARGET_MANIFEST_DBT_TARGET}" \
            --target-path "${TARGET_MANIFEST_DIR}"

          if [ ! -f "${TARGET_MANIFEST_DIR}/manifest.json" ]; then
            echo "::error::dbt parse did not produce ${TARGET_MANIFEST_DIR}/manifest.json."
            exit 1
          fi

      - name: Build changed models
        if: ${{ !inputs.skip-catalog }}
        working-directory: ${{ inputs.project-dir }}
        run: >-
          dbt build --target "${{ inputs.dbt-target }}"
          --select state:modified+ --defer
          --state "${{ runner.temp }}/target-manifest"
        continue-on-error: true
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          DBT_ENV_SECRET_PRIVATE_KEY: ${{ secrets.DBT_ENV_SECRET_PRIVATE_KEY }}

      # Produces catalog.json, the only source of the model's actual columns.
      - name: dbt docs generate
        if: ${{ !inputs.skip-catalog }}
        working-directory: ${{ inputs.project-dir }}
        run: dbt docs generate --target ${{ inputs.dbt-target }}
        continue-on-error: true
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          DBT_ENV_SECRET_PRIVATE_KEY: ${{ secrets.DBT_ENV_SECRET_PRIVATE_KEY }}

      # Annotations render violations inline on the PR diff.
      - name: Governance annotations
        working-directory: ${{ inputs.project-dir }}
        continue-on-error: true
        env:
          TARGET_BRANCH: ${{ steps.target-branch.outputs.branch }}
        run: |
          dbt-governance \
            --project-dir . \
            --rules "${{ inputs.rules-file }}" \
            ${{ inputs.changed-only && '--changed-only' || '' }} \
            ${{ inputs.changed-only && '--base-ref' || '' }} \
            ${{ inputs.changed-only && '"origin/${TARGET_BRANCH}"' || '' }} \
            --format annotations

      - name: Governance summary
        id: summary
        working-directory: ${{ inputs.project-dir }}
        env:
          TARGET_BRANCH: ${{ steps.target-branch.outputs.branch }}
        run: |
          set +e
          dbt-governance \
            --project-dir . \
            --rules "${{ inputs.rules-file }}" \
            ${{ inputs.changed-only && '--changed-only' || '' }} \
            ${{ inputs.changed-only && '--base-ref' || '' }} \
            ${{ inputs.changed-only && '"origin/${TARGET_BRANCH}"' || '' }} \
            ${{ inputs.warnings-as-errors && '--warnings-as-errors' || '' }} \
            --format markdown \
            --output "${RUNNER_TEMP}/governance.md"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/governance.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: dbt-governance
          path: ${{ runner.temp }}/governance.md

      - name: Fail on violations
        if: ${{ steps.summary.outputs.exit_code != '0' }}
        run: |
          echo "Governance checks failed. See the job summary and inline annotations."
          exit 1
